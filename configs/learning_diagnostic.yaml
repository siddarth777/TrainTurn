# Record of the 50-episode update-frequency trial on the compact scenario
# (3 platforms, 15 trains; same scenario and reward as compact.yaml).
# The trial raised updates to one per collected decision (train_every: 1), which
# is now the default everywhere, so this file differs from compact.yaml only in
# its 50-episode budget. The trial did not beat the untrained network.
station:
  platform_count: 3
scenario:
  trains: 15
  severity: 0.7
environment:
  backend: sumo
  max_platforms: 8
  forecast_count: 6
  horizon: 360
agent:
  device: cuda
  hidden: [128, 128]
  replay_capacity: 10000
  batch_size: 64
  warmup: 128
  epsilon_steps: 1500
  target_update: 100
  train_every: 1
training:
  episodes: 50
  validate_every: 5
  validation_episodes: 2
